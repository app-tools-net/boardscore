<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BoardScore</title>
<style>
  body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4f1ea;color:#1c2d24;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:480px;background:#fff;padding:20px;border-radius:12px;border:1px solid #dcd7ca}
  h1{margin:0 0 12px;font-size:1.4rem;color:#15803d}
  .row{display:flex;gap:8px}
  input[type="text"],input[type="number"]{flex:1;padding:10px;border:1px solid #dcd7ca;border-radius:10px}
  button{background:#15803d;color:#fff;border:none;padding:10px 14px;border-radius:10px;cursor:pointer}
  .player{display:flex;justify-content:space-between;padding:10px;border-radius:10px;background:#faf9f6;margin-top:8px;border:1px solid #eae6dd}
  .history{margin-top:12px;font-size:0.9rem;color:#53685c}
</style>
</head>
<body>
<div class="card">
  <h1>🎲 BoardScore</h1>
  <div class="row">
    <input id="nameField" type="text" placeholder="Player name" onkeypress="if(event.key==='Enter')addPlayer()">
    <button onclick="addPlayer()">Add</button>
  </div>
  <div id="leaderboard"></div>

  <div id="scoring" style="display:none;margin-top:12px">
    <div id="inputs"></div>
    <div style="margin-top:8px"><button onclick="saveRound()">Save Round</button></div>
  </div>

  <div id="history" class="history" style="display:none">
    <div><strong>History</strong></div>
    <div id="historyLog"></div>
  </div>
</div>

<script>
let players=[], round=1;
function addPlayer(){
  const el=document.getElementById('nameField'),name=el.value.trim();
  if(!name) return; players.push({name,score:0});el.value='';render();
}
function render(){
  const lb=document.getElementById('leaderboard'), inputs=document.getElementById('inputs');
  lb.innerHTML=players.map((p,i)=>`<div class="player"><span>${i+1}. ${p.name}</span><strong>${p.score}</strong></div>`).join('');
  if(players.length){
    document.getElementById('scoring').style.display='block';
    inputs.innerHTML=players.map(p=>`<div style="margin-top:8px"><label style="display:block">${p.name}</label><input type="number" class="score" data-name="${p.name}" placeholder="0"></div>`).join('');
  } else {
    document.getElementById('scoring').style.display='none';
  }
}
function saveRound(){
  const vals=document.querySelectorAll('.score'), log=document.getElementById('historyLog');
  let summary=[];
  vals.forEach(v=>{
    const n=v.getAttribute('data-name'), num=parseInt(v.value)||0;
    const p=players.find(x=>x.name===n);
    if(p){p.score+=num; summary.push(`${n}: +${num}`)}
    v.value='';
  });
  players.sort((a,b)=>b.score-a.score); render();
  if(summary.length){
    document.getElementById('history').style.display='block';
    const entry=document.createElement('div'); entry.textContent=`Round ${round++}: ${summary.join(', ')}`; log.insertBefore(entry,log.firstChild);
  }
}
</script>
</body>
</html>
