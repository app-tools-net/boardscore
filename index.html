<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoardScore | Simple Game Scorekeeper</title>
    <meta name="description" content="BoardScore is a free, simple, and privacy-first digital scorekeeper for board games, card games, and tabletop nights.">
    <meta name="keywords" content="board game scorekeeper, online score tracker, tabletop score keeper, digital game scoreboard, simple point counter, cards score tracker, free score app browser, game points tracker, score keeping app, tabletop score pad, board game points app, easy game score counter, scorekeeper for board games">
    <style>
        :root {
            --bg-base: #f4f1ea;
            --surface: #ffffff;
            --text-main: #1c2d24;
            --text-muted: #53685c;
            --primary: #15803d;
            --primary-hover: #166534;
            --accent-gold: #eab308;
            --border-ui: #dcd7ca;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-wrapper {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .app-card {
            background-color: var(--surface);
            border: 2px solid var(--border-ui);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 6px 12px rgba(28,45,36,0.05);
        }

        h1 {
            text-align: center;
            font-size: 1.7rem;
            font-weight: 800;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--primary);
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        input {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid var(--border-ui);
            background-color: #faf9f6;
            color: var(--text-main);
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button.success-btn {
            width: 100%;
            margin-top: 20px;
            padding: 16px;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #faf9f6;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid var(--border-ui);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rank-badge {
            font-size: 0.85rem;
            font-weight: 700;
            background: var(--border-ui);
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--text-main);
        }

        .player-row:first-child {
            border-color: var(--accent-gold);
            background: #fffdf5;
        }

        .player-row:first-child .rank-badge {
            background: var(--accent-gold);
            color: #713f12;
        }

        .player-name {
            font-weight: 600;
        }

        .player-score {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
        }

        .round-section {
            border-top: 2px dashed var(--border-ui);
            padding-top: 24px;
            margin-top: 24px;
        }

        .round-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .score-input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .score-input-wrapper label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .history-section {
            margin-top: 24px;
            border-top: 1px solid var(--border-ui);
            padding-top: 16px;
        }

        .history-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .history-log {
            font-size: 0.9rem;
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            padding: 6px 0;
            border-bottom: 1px dashed var(--border-ui);
            color: var(--text-muted);
        }

        @media (max-width: 480px) {
            .main-wrapper { padding: 12px; }
            .app-card { padding: 18px; }
            .input-group { flex-direction: column; }
            .round-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <main class="app-card">
            <h1>🎲 BoardScore</h1>
            <div class="input-group" id="setupForm">
                <input type="text" id="nameField" placeholder="Player name..." aria-label="Player name">
                <button id="addPlayerBtn">Add</button>
            </div>
            <div class="leaderboard-list" id="leaderboard" aria-live="polite"></div>
            <div class="round-section" id="scoringPanel" style="display: none;">
                <h3 style="margin-top: 0; margin-bottom: 16px; font-size: 1.1rem;">Log Round Points</h3>
                <div class="round-grid" id="inputGrid"></div>
                <button id="saveRoundBtn" class="success-btn">Save Round</button>
            </div>
            <div class="history-section" id="historyPanel" style="display: none;">
                <div class="history-title">Round History Ledger</div>
                <div class="history-log" id="historyLog" aria-live="polite"></div>
            </div>
        </main>
    </div>

    <script>
    (function(){
        'use strict';

        const STORAGE_KEY = 'boardscore_v1';

        // State with safe fallbacks
        let state = { players: [], history: [], round: 1 };
        const supportsLocal = (function(){ try { return !!window.localStorage; } catch(e){ return false; } })();

        function loadState(){
            if (!supportsLocal) return;
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (parsed && typeof parsed === 'object') state = parsed;
            } catch (e) {
                // ignore corrupted data
                console.warn('Could not load saved state:', e);
            }
        }

        function saveState(){
            if (!supportsLocal) return;
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { console.warn('Could not save state:', e); }
        }

        // DOM refs
        const nameField = document.getElementById('nameField');
        const addPlayerBtn = document.getElementById('addPlayerBtn');
        const leaderboard = document.getElementById('leaderboard');
        const scoringPanel = document.getElementById('scoringPanel');
        const inputGrid = document.getElementById('inputGrid');
        const saveRoundBtn = document.getElementById('saveRoundBtn');
        const historyPanel = document.getElementById('historyPanel');
        const historyLog = document.getElementById('historyLog');

        function sanitizeName(name){
            // Trim and collapse whitespace, limit length
            return name.replace(/\s+/g,' ').trim().slice(0, 60);
        }

        function createNewPlayer(){
            const raw = sanitizeName(nameField.value || '');
            if (!raw) return;
            // avoid duplicate names
            if (state.players.some(p => p.name.toLowerCase() === raw.toLowerCase())){
                // focus existing name field
                nameField.value = '';
                nameField.focus();
                return;
            }
            state.players.push({ name: raw, score: 0 });
            nameField.value = '';
            saveState();
            refreshInterface();
        }

        function refreshInterface(){
            // sort players by score desc
            state.players.sort((a,b) => b.score - a.score);

            // rebuild leaderboard securely using DOM methods
            leaderboard.innerHTML = '';
            state.players.forEach((player, idx) => {
                const row = document.createElement('div'); row.className = 'player-row';
                const info = document.createElement('div'); info.className = 'player-info';

                const badge = document.createElement('span'); badge.className = 'rank-badge'; badge.textContent = `#${idx + 1}`;
                const name = document.createElement('span'); name.className = 'player-name'; name.textContent = player.name;
                info.appendChild(badge); info.appendChild(name);

                const score = document.createElement('span'); score.className = 'player-score'; score.textContent = String(player.score);

                row.appendChild(info); row.appendChild(score);
                leaderboard.appendChild(row);
            });

            // scoring inputs
            inputGrid.innerHTML = '';
            if (state.players.length > 0){
                scoringPanel.style.display = 'block';
                state.players.forEach((player, idx) => {
                    const wrapper = document.createElement('div'); wrapper.className = 'score-input-wrapper';
                    const lbl = document.createElement('label'); lbl.textContent = player.name;
                    const inp = document.createElement('input'); inp.type = 'number'; inp.className = 'round-score-field'; inp.setAttribute('inputmode','numeric');
                    inp.dataset.name = player.name; inp.placeholder = '0';
                    // prevent non-number entry and limit values
                    inp.addEventListener('input', () => {
                        if (inp.value && !/^[-+]?\d+$/.test(inp.value)) inp.value = inp.value.replace(/[^-+0-9]/g,'');
                        if (inp.value.length > 6) inp.value = inp.value.slice(0,6);
                    });
                    wrapper.appendChild(lbl); wrapper.appendChild(inp); inputGrid.appendChild(wrapper);
                });
            } else {
                scoringPanel.style.display = 'none';
            }

            // history
            historyLog.innerHTML = '';
            if (state.history && state.history.length){
                historyPanel.style.display = 'block';
                state.history.slice().reverse().forEach(entry => {
                    const item = document.createElement('div'); item.className = 'history-item';
                    item.textContent = entry; historyLog.appendChild(item);
                });
            } else {
                historyPanel.style.display = 'none';
            }
        }

        function commitRoundScores(){
            const inputs = Array.from(document.querySelectorAll('.round-score-field'));
            if (!inputs.length) return;
            const roundSummary = [];
            inputs.forEach(inp => {
                const name = inp.dataset.name;
                const val = inp.value.trim();
                const added = parseInt(val, 10) || 0;
                const player = state.players.find(p => p.name === name);
                if (player){
                    player.score = (player.score || 0) + added;
                    roundSummary.push(`${name}: +${added}`);
                }
                inp.value = '';
            });
            if (roundSummary.length){
                const text = `Round ${state.round} ➡️ ${roundSummary.join(', ')}`;
                state.history = state.history || [];
                state.history.push(text);
                state.round = (state.round || 1) + 1;
                saveState();
                refreshInterface();
            }
        }

        // Keyboard accessibility: Enter to add player
        nameField.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); createNewPlayer(); } });
        addPlayerBtn.addEventListener('click', createNewPlayer);
        saveRoundBtn.addEventListener('click', commitRoundScores);

        // export/import helpers (useful when moving domains)
        function exportState(){
            try {
                const data = JSON.stringify(state);
                const blob = new Blob([data], {type:'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'boardscore-data.json'; document.body.appendChild(a);
                a.click(); a.remove(); URL.revokeObjectURL(url);
            } catch (e){ alert('Export failed'); }
        }

        function importState(file){
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(){
                try{
                    const parsed = JSON.parse(reader.result);
                    if (parsed && typeof parsed === 'object'){
                        state = parsed; saveState(); refreshInterface();
                    }
                } catch(e){ alert('Import failed: invalid file'); }
            };
            reader.readAsText(file);
        }

        // public hooks for manual export/import (not exposed in UI by default)
        window.BoardScore = { exportState, importState };

        // init
        loadState(); refreshInterface();

    })();
    </script>
</body>
</html>
